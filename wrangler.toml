name = "cargoo-platform"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next"

# -----------------------------------------------------------------------------
# Non-secret build/runtime config. Safe to commit. Cloudflare Pages will inject
# these into the Worker as process.env.<NAME>.
# -----------------------------------------------------------------------------
[vars]
PUBLIC_SITE_URL = "https://www.cargooimport.eu"
FROM_EMAIL = "Cargoo Import <contact@cargooimport.eu>"
# Leading dot is intentional — makes the session/CSRF cookies valid across
# admin., www., blog., and the apex so navigating between subdomains keeps
# the user logged in.
COOKIE_DOMAIN = ".cargooimport.eu"

# Cold-outreach drip + reply detection -----------------------------------------
# REPLIES_INBOX       Reply-To on cold sends. Customer replies land here; the
#                     inbound-reply webhook flips ColdOutreach.replied=true.
# UNSUBSCRIBE_MAILTO  mailto: fallback target for the List-Unsubscribe header.
REPLIES_INBOX = "contact@cargooimport.eu"
UNSUBSCRIBE_MAILTO = "contact@cargooimport.eu"

# Drip cron tuning. EMAIL_DAILY_CAP is shared with /api/admin/outreach/cold
# (see lib/cold-email/config.ts) — bump it gradually, large jumps trigger
# Gmail/Outlook reputation throttling.
EMAIL_DAILY_CAP = "25"
DRIP_FOLLOWUP_COOLDOWN_DAYS = "3"
DRIP_MAX_TOUCHES = "3"
DRIP_WINBACK_AFTER_DAYS = "7"

# -----------------------------------------------------------------------------
# Secrets (NOT declared here — managed via Cloudflare Pages dashboard or
# `wrangler pages secret put <NAME>`). Code expects:
#
#   DATABASE_URL       Neon Postgres connection string (postgres://...)
#   SESSION_SECRET     Customer-account JWT signing secret (32+ random bytes,
#                      base64). Used by lib/account-auth.ts and lib/mail.ts.
#                      NEXTAUTH_SECRET is accepted as a fallback for back-compat.
#   NEXTAUTH_SECRET    Admin NextAuth signing secret (kept for legacy admin path)
#   RESEND_API_KEY     Resend API key for outbound email
#   ADMIN_EMAIL        Hardcoded admin login email (lib/auth.ts)
#   ADMIN_PASSWORD     Hardcoded admin login password (lib/auth.ts)
#   AGENT_SECRET       Bearer token for the cold-outreach agent
#                      (POST /api/admin/outreach/cold with
#                      `Authorization: Bearer <AGENT_SECRET>`)
#
# Optional tuning (set in [vars] above or as a secret):
#
#   EMAIL_DAILY_CAP                Default: 25. Shared between new cold sends
#                                  and drip follow-ups. Ramp up gradually for
#                                  deliverability. Replaces the old
#                                  COLD_OUTREACH_DAILY_LIMIT + DRIP_DAILY_CAP
#                                  pair — if those are still set in the
#                                  Cloudflare dashboard, delete them.
#   COLD_OUTREACH_COOLDOWN_HOURS   Default: 12. Minimum gap between two sends to
#                                  the same address.
#   ENABLE_FIRST_ADMIN_SETUP       Default: unset. Set to "true" only while
#                                  bootstrapping the first admin via
#                                  GET /api/auth/setup-first-admin, then DELETE
#                                  the var to permanently disable the endpoint.
# -----------------------------------------------------------------------------
